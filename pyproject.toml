[project]
name = "denpa-bot.py"
version = "0.1.0"
description = "porting the denpa bot to python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "beautifulsoup4>=4.14.3",
    "davey>=0.1.6",
    "discord-py>=2.6.4",
    "pynacl>=1.6.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "yt-dlp[curl-cffi,default]>=2026.11.23",
]

[tool.uv]
# we want the yt-dlp dep to track nightlies. uv doesn't seem to have a
# per-package setting yet so we have to set this for every package.....
#
# this setting will matter when:
# - we run `uv lock --upgrade`
# - we run `uv add <package>`
# - we delete `uv.lock` and then run `uv sync`
#
# the only thing we might do in the future is `uv add`
# when you do, check the "Updated/Added" output for a/b/rc/.dev versions
prerelease = "allow"
